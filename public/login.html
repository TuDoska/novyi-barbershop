<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вхід — NOVYI_ BARBERSHOP</title>
  <meta name="description" content="Вхід і реєстрація в NOVYI_ BARBERSHOP.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0b0a">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=4">
</head>
<body class="is-loaded app">
  <div class="grain" aria-hidden="true"></div>
  <header class="header" id="header">
    <a href="/" class="brand" aria-label="NOVYI_ BARBERSHOP — на головну">
      <span class="brand__mark">N</span>
      <span class="brand__name">NOVYI<i>_</i></span>
    </a>
    <nav class="nav" aria-label="Головне меню">
      <a href="/#services">Послуги</a>
      <a href="/#masters">Майстри</a>
      <a href="/booking">Запис</a>
      <a href="/#contact">Контакти</a>
    </nav>
    <a class="header__account" href="/login"><span class="header__account-name">Увійти</span></a>
    <button class="burger" aria-label="Меню" aria-expanded="false"><span></span><span></span></button>
  </header>

  <main class="page">
    <div class="page--narrow">
      <div class="page__head">
        <p class="eyebrow">Акаунт клієнта</p>
        <h1 class="title">Ласкаво <em>просимо</em></h1>
        <p class="muted">Ваші візити, найближчий запис і таймер до наступної стрижки — в одному місці.</p>
      </div>
      <div class="panel panel--gold">
        <div class="tabs" role="tablist">
          <button class="is-active" data-tab="login" role="tab">Вхід</button>
          <button data-tab="register" role="tab">Реєстрація</button>
        </div>
        <form class="form" data-form="login" novalidate>
          <label class="field"><span>Телефон</span><input class="input" name="phone" type="tel" autocomplete="tel" placeholder="067 123 45 67" required></label>
          <label class="field"><span>Пароль</span><input class="input" name="password" type="password" autocomplete="current-password" required></label>
          <p class="field__err" data-err></p>
          <button class="btn btn--gold btn--block">Увійти</button>
        </form>
        <form class="form" data-form="register" hidden novalidate>
          <label class="field"><span>Імʼя</span><input class="input" name="name" autocomplete="name" maxlength="40" required></label>
          <label class="field"><span>Телефон</span><input class="input" name="phone" type="tel" autocomplete="tel" placeholder="067 123 45 67" required></label>
          <label class="field"><span>Пароль</span><input class="input" name="password" type="password" autocomplete="new-password" minlength="8" required>
            <span class="field__hint">Щонайменше 8 символів. Натисніть на око, щоб звірити пароль.</span></label>
          <label class="check"><input type="checkbox" name="agree"> <span>Погоджуюсь на обробку імені й телефону для запису. Дані бачать лише барбершоп і майстри.</span></label>
          <p class="field__err" data-err></p>
          <button class="btn btn--gold btn--block">Створити акаунт</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <span class="brand__name">NOVYI<i>_</i></span>
    <p>© <span id="year"></span> NOVYI_ BARBERSHOP · Стрий · <a href="tel:+380739012596">+380 73 901 25 96</a></p>
    <a href="/">На головну</a>
  </footer>
  <script src="/js/api.js?v=4"></script>
  <script src="/js/login.js?v=4"></script>
</body>
</html>
